<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>VIT-Vellore - Campus Map & Search</title>
<meta name="description" content="A fast, no-login map and search for VIT Vellore: every hostel, canteen, cycle stand and ATM, with directions between them. Built from OpenStreetMap.">
<link rel="canonical" href="/">

<meta property="og:type" content="website">
<meta property="og:title" content="VIT-Vellore - Campus Map & Search">
<meta property="og:description" content="A fast, no-login map and search for VIT Vellore: every hostel, canteen, cycle stand and ATM, with directions between them.">
<meta property="og:image" content="/images/campus-aerial.jpg">
<meta property="og:image:alt" content="Aerial view of the VIT Vellore campus">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="VIT-Vellore - Campus Map & Search">
<meta name="twitter:description" content="A fast, no-login map and search for VIT Vellore: every hostel, canteen, cycle stand and ATM, with directions between them.">
<meta name="twitter:image" content="/images/campus-aerial.jpg">

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000000'/><rect x='1' y='1' width='30' height='30' fill='none' stroke='%2355ffff' stroke-width='1'/><path d='M8 9 L16 22 L24 9' stroke='%2355ffff' stroke-width='2.5' fill='none' stroke-linejoin='round'/><circle cx='16' cy='14' r='2' fill='%23ffff55'/></svg>">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "VIT-Vellore - Campus Map & Search",
  "description": "A fast, no-login map and search for VIT Vellore: every hostel, canteen, cycle stand and ATM, with directions between them.",
  "about": { "@type": "Place", "name": "VIT Vellore" }
}
</script>
</head>
<body>
  <div id="map" aria-label="Campus map"></div>

  <header id="bar">
    <button id="brand-btn" type="button" title="About &amp; data sources, VIT Vellore, your current map">
      <span class="hud-corner tl" aria-hidden="true"></span>
      <span class="hud-corner tr" aria-hidden="true"></span>
      <span class="hud-corner bl" aria-hidden="true"></span>
      <span class="hud-corner br" aria-hidden="true"></span>
      <span class="brand-ping" aria-hidden="true">
        <span class="p-dot"></span>
        <span class="p-ring"></span>
        <span class="p-ring"></span>
      </span>
      VIT
    </button>
    <button id="open-search" type="button" aria-label="Locate campus">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M10.5 10.5 L14.2 14.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span class="ph">Locate places</span>
      <kbd>CTRL+SHIFT+F</kbd>
    </button>
    <button id="layers-btn" type="button" aria-expanded="false" aria-controls="layers">
      <span class="dots" aria-hidden="true"></span>
      <span class="n"></span>
    </button>
  </header>

  <!-- One stack, so the chips can wrap to any number of rows without ever
       colliding with the footer below them. -->
  <div id="dock">
    <nav id="layers" aria-label="Map layers">
      <span class="hud-corner tl" aria-hidden="true"></span>
      <span class="hud-corner tr" aria-hidden="true"></span>
      <span class="hud-corner bl" aria-hidden="true"></span>
      <span class="hud-corner br" aria-hidden="true"></span>
      <div class="layers-head">
        <span class="t">Legend</span>
        <button type="button" data-all title="Show every category">Show all</button>
        <button type="button" data-none title="Hide every category">Hide all</button>
        <button type="button" class="layers-close" aria-label="Close layers">&times;</button>
      </div>
      <div id="layer-chips"></div>
    </nav>
    <footer id="foot">
      <a href="https://github.com/rugbedbugg/vit-map" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>source</span>
      </a>
    </footer>
  </div>

  <div id="attrib">
    <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
  </div>

  <div id="hud-coords" aria-hidden="true"></div>

  <section id="panel" hidden aria-live="polite"></section>

  <div id="palette" hidden role="dialog" aria-modal="true" aria-label="Locate campus">
    <div id="palette-box">
      <span class="hud-corner tl" aria-hidden="true"></span>
      <span class="hud-corner tr" aria-hidden="true"></span>
      <span class="hud-corner bl" aria-hidden="true"></span>
      <span class="hud-corner br" aria-hidden="true"></span>
      <div id="palette-input-row">
        <span id="palette-glyph" aria-hidden="true">›</span>
        <input id="palette-input" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" enterkeyhint="go"
               placeholder="Library · Cycle · ATM · Hostel …"
               aria-label="Locate campus" aria-controls="palette-results" aria-expanded="true">
        <span id="palette-timing" aria-hidden="true"></span>
        <button id="palette-close" type="button" aria-label="Close search">&times;</button>
      </div>
      <div id="palette-results" role="listbox"></div>
      <footer id="palette-foot">
        <span class="hint"><kbd>↑↓</kbd> move</span>
        <span class="hint"><kbd>↵</kbd> open</span>
        <span class="hint"><kbd>tab</kbd> route</span>
        <a id="palette-repo" href="https://github.com/rugbedbugg/vit-map" target="_blank" rel="noopener">contribute</a>
        <span id="palette-count"></span>
      </footer>
    </div>
  </div>

  <div id="boot">booting campus index…</div>
  <div id="crt" aria-hidden="true"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
